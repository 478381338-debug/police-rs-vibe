version: "1.0"
updated: "2026-11-16"
note: "权重与阈值为专家先验，未校准；score 是排序分，不是概率。业务优先级不因本文件自动改写。"

families:
  O: {label: "光学变化", weight_note: "反射率/指数变化"}
  S: {label: "结构与设施", weight_note: "坑缘/建筑/道路/堆场"}
  L: {label: "物流与目标", weight_note: "车辆/机械/船只/卡口"}
  D: {label: "形变/SAR", weight_note: "沉降/相干性"}
  T: {label: "时序/夜间", weight_note: "夜光/热异常/节律"}
  C: {label: "合规与行政", weight_note: "许可/边界/关闭/用电/火工品"}
  H: {label: "人工核验", weight_note: "现场/无人机/笔录"}

time_decay:
  "0-30": 1.0
  "31-90": 0.9
  "91-180": 0.7
  ">180": 0.4
  "unknown": 0.5

factors:
  F01: {family: O, name: "裸地扩张/持续", reliability: 0.80, window_days: 90}
  F02: {family: S, name: "采坑形态/台阶", reliability: 0.70, window_days: 90}
  F03: {family: S, name: "堆场/体积增长", reliability: 0.65, window_days: 180}
  F04: {family: S, name: "新增建筑/构筑物（含硐口）", reliability: 0.70, window_days: 90, note: "仅高分；Sentinel-2 单源 reliability 0.35、强度上限 0.33"}
  F05: {family: S, name: "建筑形态/屋顶材质", reliability: 0.55, window_days: 90}
  F06: {family: S, name: "新增/加宽道路/车辙", reliability: 0.65, window_days: 90}
  F07: {family: L, name: "机械/车辆/采砂船", reliability: 0.60, window_days: 30, note: "≤1m；10m 记 null（不可判）"}
  F08: {family: L, name: "车辆/机械频次时序", reliability: 0.55, window_days: 30}
  F09: {family: T, name: "夜间灯光/热异常", reliability: 0.35, window_days: 30, note: "VIIRS 0.35；SDGSAT-1 0.50"}
  F10: {family: D, name: "InSAR 形变/相干性", reliability: 0.55, window_days: 365}
  F11: {family: O, name: "水体浑浊/排水/铁染", reliability: 0.50, window_days: 30}
  F12: {family: O, name: "植被胁迫/恢复", reliability: 0.45, window_days: 90}
  F13: {family: C, name: "历史扰动/复采", reliability: 0.70, window_days: 3650, note: "1.0 需闭矿/修复后再次扰动，不是仅‘已关闭’"}
  F14: {family: C, name: "合规边界关系", reliability: 0.80, window_days: 365}
  F15: {family: C, name: "许可/审批状态", reliability: 0.85, window_days: 365}
  F16: {family: C, name: "用电/用水/炸药/称重", reliability: 0.80, window_days: 30}
  F17: {family: H, name: "现场核查/无人机/人工", reliability: 1.00, window_days: 30}
  F18: {family: L, name: "卡口/称重/AIS/运输监管", reliability: 0.75, window_days: 7}

negatives:
  N01: {name: "物候解释", downgrade_at: 0.67, reject_at: 1.0}
  N02: {name: "农田管理", downgrade_at: 0.67, reject_at: 1.0, note: "不硬删除"}
  N03: {name: "合法工程/修复", downgrade_at: 0.67, note: "有文件→合规观察"}

quality:
  Q01: {name: "观测质量", rule: "valid_frac<0.8 或 cloud>30% 或 registration>1px 或 snow"}
  Q02: {name: "分辨率不匹配", rule: "目标<3 像元"}
  Q03: {name: "基线/许可缺失", rule: "baseline_insufficient 或许可缺失"}

scenarios:
  S1:
    name: "露天采坑新增/扩张"
    weights: {O: 0.30, S: 0.30, L: 0.10, D: 0.05, T: 0.03, C: 0.17, H: 0.05}
    required_family_any: [O, S]
    key_factors: [F01, F02, F03, F06, F07, F14, F15, F17]
  S2:
    name: "硐采/井工偷挖"
    weights: {O: 0.10, S: 0.25, L: 0.05, D: 0.30, T: 0.05, C: 0.20, H: 0.05}
    required_family_any: [D, S]
    key_factors: [F03, F04, F09, F10, F11, F16, F17]
  S3:
    name: "矿区违规建筑/临时设施"
    weights: {O: 0.10, S: 0.45, L: 0.05, D: 0.00, T: 0.02, C: 0.28, H: 0.10}
    required_family_any: [S]
    key_factors: [F01, F03, F04, F05, F06, F14, F15, F17]
  S4:
    name: "运输/外运异常"
    weights: {O: 0.05, S: 0.15, L: 0.40, D: 0.00, T: 0.05, C: 0.25, H: 0.10}
    required_family_any: [L, S]
    key_factors: [F06, F07, F08, F09, F15, F17, F18]
  S5:
    name: "河道采砂"
    weights: {O: 0.25, S: 0.25, L: 0.10, D: 0.00, T: 0.03, C: 0.27, H: 0.10}
    required_family_any: [O, S]
    key_factors: [F01, F03, F06, F07, F11, F14, F15, F17, F18]
  S6:
    name: "堆场/排土场/尾矿"
    weights: {O: 0.15, S: 0.25, L: 0.05, D: 0.25, T: 0.02, C: 0.18, H: 0.10}
    required_family_any: [O, S, D]
    key_factors: [F03, F10, F11, F12, F14, F15, F17]
  S7:
    name: "废弃矿山复采"
    weights: {O: 0.20, S: 0.25, L: 0.10, D: 0.10, T: 0.05, C: 0.20, H: 0.10}
    required_family_any: [O, S]
    key_factors: [F01, F06, F07, F10, F13, F14, F15, F17]

evidence_tiers:
  # 判定顺序 A→B→C→D；C 的 any 表示 min_score 或 min_families 任一满足即可
  A: {logic: all, min_score: 70, min_families: 3, require_physical: true, require_no_veto: true,
       require_any: ["F17>=0.67", "direct_families>=2@0.67"]}
  B: {logic: all, min_score: 55, min_families: 2, require_physical: true, require_no_veto: true}
  C: {logic: any, min_score: 40, min_families: 1}
  D: {logic: else}

priority:
  base: {A: P1, B: P2, C: P3, D: Q}
  upgrade:
    - {name: "保护区/饮用水源/禁采区", levels: 1, require_evidence_tier: B}
    - {name: "夜间/节假日持续", levels: 1, require_evidence_tier: B}
    - {name: "重复/屡查屡犯", levels: 1, require_evidence_tier: B}
    - {name: "大面积/快速扩张", levels: 1, require_evidence_tier: B}
  cap: P1